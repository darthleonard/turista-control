<ion-content class="ion-padding">
  <ion-modal [isOpen]="isModalOpen">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-title>Modal</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="setOpen(false)">Close</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <ion-searchbar
          animated="true"
          placeholder="CELL_NAME"
          (ionInput)="searchCell($event)"
        ></ion-searchbar>
        <ion-list>
          <ion-item
            *ngFor="let item of searchResults"
            (click)="onSelect(item.id)"
            [ngStyle]="{
              'border-left': item.color ? '10px solid ' + item.color : null
            }"
            class="cell-item"
          >
            <ion-label>{{ item.name }}</ion-label>
          </ion-item>
        </ion-list>
      </ion-content>
    </ng-template>
  </ion-modal>
</ion-content>
