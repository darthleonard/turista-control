<ion-content class="ion-padding">
  <ion-modal [isOpen]="isModalOpen">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-title>Player Actions</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="setOpen(false)">Close</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <ion-item>
          <ion-label position="floating">Current Cell</ion-label>
          <ion-input type="text" />
        </ion-item>

        <ion-item>
          <ion-label position="floating">Pay Tax</ion-label>
          <ion-input type="text" />
        </ion-item>

        <ion-item>
          <ion-label position="floating">Earn Money</ion-label>
          <ion-input type="text" />
        </ion-item>

        <ion-item>
          <ion-label position="floating">Buy Property</ion-label>
          <ion-input type="text" />
        </ion-item>
        <ion-button (click)="setOpen(false)">Finish</ion-button>
      </ion-content>
    </ng-template>
  </ion-modal>
</ion-content>
