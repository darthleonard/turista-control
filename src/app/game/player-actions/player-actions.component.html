<ion-content class="ion-padding">
  <ion-modal [isOpen]="isModalOpen">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-title>Player Actions</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="setOpen(false)">Close</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <ion-item>
          <ion-label position="floating">
            {{ "MONEY_PAID" | translate }}
          </ion-label>
          <ion-input
            type="number"
            [(ngModel)]="turnDetails.playerDebit"
            name="playerDebit"
          />
        </ion-item>

        <ion-item>
          <ion-label position="floating">
            {{ "MONEY_RECEIVED" | translate }}
          </ion-label>
          <ion-input
            type="number"
            [(ngModel)]="turnDetails.playerCredit"
            name="playerCredit"
          />
        </ion-item>

        <ion-item>
          <ion-label position="floating">Buy Property</ion-label>
          <!-- <ion-input
            type="number"
            [(ngModel)]="turnDetails.playerTotalMoney"
            name="playerTotalMoney"
          /> -->
        </ion-item>
        <ion-button (click)="save()">Finish</ion-button>
        <ion-button *ngIf="true" (click)="save()" color="success">
          {{ "BUY_PROPERTY" | translate }}
        </ion-button>
      </ion-content>
    </ng-template>
  </ion-modal>
</ion-content>
